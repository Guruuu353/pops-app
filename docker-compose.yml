services:
  pops:
    build: .
    restart: unless-stopped
    environment:
      POPS_ADMIN_EMAIL: ${POPS_ADMIN_EMAIL:-admin@patteconservation.com}
      POPS_ADMIN_PASSWORD: ${POPS_ADMIN_PASSWORD:-}
    volumes:
      - pops-data:/data
    ports:
      - "127.0.0.1:8086:8080"

volumes:
  pops-data: {}

